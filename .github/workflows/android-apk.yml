
name: Build Forklift APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game project
        run: |
          unzip -o ForkliftDriverAndroid_FINAL.zip -d project
          find project -type f -name "*.xml" -exec sed -i '1{/^[[:space:]]*$/d;}' {} +
          
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ForkliftDriver-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
