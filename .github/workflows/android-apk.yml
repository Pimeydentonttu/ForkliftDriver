name: Build Forklift APK Automatically

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Build Gradle Project
        run: |
          echo "Etsitään Gradle-tiedostoa..."
          GRADLE_FILE=$(find . \( -name "build.gradle.kts" -o -name "build.gradle" \) -not -path "*/.*" | head -n 1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "Virhe: Gradle-tiedostoa ei löytynyt repositoriosta!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Löydetty projektin kansio: $PROJECT_DIR"
          
          # Siirrytään projektin kansioon ja suoritetaan kääntö
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForkliftDriver-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
